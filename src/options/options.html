<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تنظیمات VoiceType Pro</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="options">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/icons/icon48.png" alt="" width="30" height="30">
        <div>
          <strong>VoiceType Pro</strong>
          <div class="hint" id="version"></div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="small" id="open-panel">کنسول صوتی</button>
        <button class="small" id="open-shortcuts">میانبرها</button>
      </div>
    </aside>

    <main class="content">
      <header class="content-head">
        <h1 id="section-title">تنظیمات</h1>
        <div class="vt-spacer"></div>
        <span class="pill" id="state-pill"><span class="dot idle"></span><span id="state-label">آماده</span></span>
      </header>
      <div id="alerts" class="vt-col"></div>
      <section id="section-body" class="section-body"></section>
    </main>
  </div>
  <div id="vt-toasts" class="vt-toasts"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
